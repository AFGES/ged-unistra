name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, unit tests and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and unit tests
        run: docker build --target test .

      - name: Build image
        run: docker build -t ged-unistra:ci .

      - name: Smoke test
        run: |
          docker run -d --name proxy -p 3000:80 ged-unistra:ci
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 1
          done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PROPFIND http://127.0.0.1:3000/)" = 401
          # Admin endpoints answer on 8081 only; on 80 they are WebDAV paths behind Basic Auth
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin/cache/stats)" = 401
          docker exec proxy wget -qO- http://127.0.0.1:8081/admin/cache/stats | grep -q keys_count

      - name: Proxy logs
        if: always()
        run: docker logs proxy || true

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
