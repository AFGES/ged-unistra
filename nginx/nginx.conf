lua_shared_dict cas_session_cache 10m;
lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 5;

resolver local=on ipv6=off valid=300s;

init_by_lua_block {
    require("config").init()
}

upstream ged_backend {
    server ged.unistra.fr:443;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location = /admin/cache/stats {
        content_by_lua_block {
            require("admin").cache_stats()
        }
    }

    location = /admin/cache/clear {
        content_by_lua_block {
            require("admin").cache_clear()
        }
    }

    location / {
        access_by_lua_block {
            require("webdav_proxy").authenticate()
        }

        proxy_pass          https://ged_backend/nuxeo/site/dav/;
        proxy_ssl_server_name on;
        proxy_ssl_name      ged.unistra.fr;
        proxy_ssl_verify    on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header    Host ged.unistra.fr;
        proxy_set_header    Connection "";
        proxy_http_version  1.1;

        # Stream request body (large PUT uploads go direct, no disk buffering)
        proxy_request_buffering off;
        client_max_body_size    0;

        header_filter_by_lua_block {
            require("webdav_proxy").rewrite_response_headers()
        }

        body_filter_by_lua_block {
            require("webdav_proxy").rewrite_propfind_body()
        }
    }
}
