lua_shared_dict cas_session_cache 10m;
lua_shared_dict cas_auth_state 1m;
lua_shared_dict dav_folder_dates 1m;
lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 5;

resolver local=on ipv6=off valid=300s;

# Client address for the failed-login limits (lua/limiter.lua): the reverse proxy in front appends it to
# X-Forwarded-For. Private ranges are trusted, so the rightmost address outside them is the client.
# Deploy behind a reverse proxy: a client on a private network could otherwise pick its own address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

init_by_lua_block {
    require("config").init()
}

# Combined format plus the WebDAV Depth header (PROPFIND listing depth) and the request time
log_format dav '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent" depth=$http_depth rt=$request_time';

upstream ged_backend {
    server ged.unistra.fr:443;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout dav;

    location = /health {
        content_by_lua_block {
            require("admin").health()
        }
    }

    location / {
        access_by_lua_block {
            require("webdav_proxy").authenticate()
            require("root_dates").serve_root()
        }

        proxy_pass          https://ged_backend/nuxeo/site/dav/;
        proxy_ssl_server_name on;
        proxy_ssl_name      ged.unistra.fr;
        proxy_ssl_verify    on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header    Host ged.unistra.fr;
        proxy_set_header    Connection "";
        proxy_http_version  1.1;

        # Stream request body (large PUT uploads go direct, no disk buffering)
        proxy_request_buffering off;
        client_max_body_size    0;

        header_filter_by_lua_block {
            require("webdav_proxy").rewrite_response_headers()
        }

        body_filter_by_lua_block {
            require("webdav_proxy").rewrite_propfind_body()
        }
    }
}

# Admin endpoints: no authentication, so on their own port. Never publish 8081: keep it on a private network.
server {
    listen 8081;
    server_name _;

    location = /admin/cache/stats {
        content_by_lua_block {
            require("admin").cache_stats()
        }
    }

    location = /admin/cache/clear {
        content_by_lua_block {
            require("admin").cache_clear()
        }
    }

    location / {
        return 404;
    }
}
