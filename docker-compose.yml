services:
  webdav-cas-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: webdav-cas-proxy:1.0.0
    container_name: webdav-cas-proxy
    ports:
      - "3000:80"
    environment:
      - CAS_LOGIN_URL=https://cas.unistra.fr/cas/login?service=https%3A%2F%2Fged.unistra.fr%2Fnuxeo%2Fnxstartup.faces
      - WEBDAV_BASE_URL=https://ged.unistra.fr/nuxeo/site/dav
      - AUTH_CACHE_TTL=3000
      - DEBUG_MODE=false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
        reservations:
          memory: 32M
          cpus: "0.1"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
